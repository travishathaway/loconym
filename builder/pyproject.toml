[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loconym"
dynamic = ["version"]
description = "Build compact, offline reverse and forward geocoding databases from OpenStreetMap PBF files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["geocoding", "reverse-geocoding", "openstreetmap", "osm", "sqlite", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
# Keep in sync with the [dependencies] block of the root pixi.toml (conda-forge names differ: osmium = pyosmium).
dependencies = [
    "osmium>=4",            # pyosmium: PBF reading, node location index, tag filters
    "shapely>=2",           # admin polygon assembly, clipping, STRtree
    "apsw>=3.54.1.0,<4",    # SQLite with VFS hooks (page-read benchmarks)
]
# Optional, not on PyPI: osmium-tool (`osmium` binary) enables `loconym build --prefilter` for large extracts.

[project.urls]
Homepage = "https://travishathaway.github.io/loconym/"
Documentation = "https://travishathaway.github.io/loconym/"
Repository = "https://github.com/travishathaway/loconym"
Issues = "https://github.com/travishathaway/loconym/issues"

[project.scripts]
loconym = "loconym.cli:main"
loconym-bench = "loconym.bench:main"
loconym-golden = "loconym.golden:main"

[tool.hatch.version]
path = "src/loconym/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loconym"]

[tool.hatch.build.targets.sdist]
include = ["src/loconym", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905"]
per-file-ignores = { "tests/*" = ["E501"], "src/loconym/golden.py" = ["E501", "B015"] }
