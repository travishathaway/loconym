name: npm

# Pushing a tag `js-vX.Y.Z` tests, builds and publishes the TypeScript client (client/) to npm as @thath/logator.
# Run it manually (workflow_dispatch) for a dry run that shows exactly what would be published.

on:
  push:
    tags: ["js-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only run `npm publish --dry-run`"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @thath/logator
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@thath/logator
    permissions:
      contents: read
      id-token: write  # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/js-v')
        run: |
          version=$(node -p "require('./client/package.json').version")
          if [ "js-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match client/package.json version $version"
            exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: js

      - name: Test
        run: pixi run -e js client-test

      - name: Build
        run: pixi run -e js client-build

      - name: Publish
        working-directory: client
        env:
          # Optional: only needed for the very first publish, before a trusted publisher is configured on npmjs.com.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            pixi run -e js npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=project
          fi
          if [ "$DRY_RUN" = "true" ]; then
            pixi run -e js npm publish --dry-run
          else
            pixi run -e js npm publish
          fi
