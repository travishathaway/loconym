name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Monaco drives the Python build test; Bremen is turned into golden vectors for the client parity tests.
      # Both come from the Actions cache; Geofabrik is only hit on a cache miss (see .github/actions/osm-extract).
      - uses: ./.github/actions/osm-extract
        with: { name: monaco, path: europe/monaco }

      - uses: ./.github/actions/osm-extract
        with: { name: bremen, path: europe/germany/bremen }

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Lint (ruff)
        run: pixi run lint

      - name: Python tests
        run: pixi run test-builder

      - name: Generate Bremen golden vectors
        run: pixi run golden-data

      - name: TypeScript client tests
        run: pixi run client-test

      - name: Build the client and the Berlin map demo (typecheck)
        run: pixi run demo-build

      - name: Build the example app (typecheck)
        run: pixi run example-build
