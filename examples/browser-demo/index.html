<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loconym demo</title>
    <!-- follow the OS light/dark setting (Bootstrap color modes) -->
    <script>
      const dark = matchMedia('(prefers-color-scheme: dark)');
      const setTheme = () => document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
      setTheme();
      dark.addEventListener('change', setTheme);
    </script>
  </head>
  <body>
    <aside id="panel" class="d-flex flex-column gap-3 p-3 border-end bg-body">
      <header>
        <h1 class="h4 mb-1">loconym</h1>
        <p class="text-body-secondary small mb-0">
          Offline geocoding from one SQLite file. No server: the browser reads the parts of the database it needs.
        </p>
      </header>

      <div class="row g-2">
        <div class="col">
          <label for="db" class="form-label small text-body-secondary mb-1">Dataset</label>
          <select id="db" class="form-select form-select-sm">
            <option value="berlin">Berlin</option>
            <option value="monaco">Monaco</option>
          </select>
        </div>
        <div class="col">
          <label for="mode" class="form-label small text-body-secondary mb-1">Data retrieval</label>
          <select id="mode" class="form-select form-select-sm">
            <option value="range">Range requests</option>
            <option value="fetch">Full download</option>
          </select>
        </div>
      </div>

      <div>
        <input id="q" type="search" class="form-control" placeholder="Search an address" autocomplete="off"
          spellcheck="false" aria-label="Search an address" disabled />
        <div id="results" class="list-group list-group-flush mt-2"></div>
      </div>

      <section id="detail" class="card" hidden>
        <div class="card-body">
          <h2 id="detail-title" class="card-title h6"></h2>
          <dl id="detail-rows" class="row small mb-0"></dl>
        </div>
      </section>

      <footer class="mt-auto small text-body-secondary">
        <p id="status" class="mb-2" aria-live="polite">Loading…</p>
        <p class="mb-0">
          Click the map to reverse geocode. Data ©
          <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL).
          <a href="https://travishathaway.github.io/loconym/how-to/run-the-example/">About this example</a>
        </p>
      </footer>
    </aside>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
